<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MEGALINE HTV Track Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MEGALINE HTV TRACK RECORD — DESIGN TOKENS
   ========================================================= */
:root{
  --bg:#ffffff;
  --surface:#f5f7fa;
  --surface-2:#ebeff3;
  --surface-3:#e2e7ec;
  --border:#dce3e9;
  --border-strong:#c3ccd4;
  --ink:#12181f;
  --ink-2:#48545f;
  --ink-3:#7c8791;
  --brand:#00529c;
  --brand-ink:#003d75;
  --brand-tint:#e6f0fa;
  --brand-tint-2:#d0e3f4;
  --accent-green:#2e8b6e;
  --accent-green-tint:#e4f3ec;
  --good:#2e8b6e;
  --warn:#b9832c;
  --critical:#b84a3e;
  --chart-blue-1:#d7e8f6;
  --chart-blue-2:#a9cdea;
  --chart-blue-3:#6ba6d6;
  --chart-blue-4:#2e78b4;
  --chart-blue-5:#00529c;
  --chart-green-1:#d9f0e5;
  --chart-green-2:#a9dcc4;
  --chart-green-3:#6fbe9c;
  --chart-green-4:#2e8b6e;
  --shadow-1:0 1px 2px rgba(18,24,31,0.06), 0 1px 1px rgba(18,24,31,0.04);
  --shadow-2:0 8px 24px rgba(18,24,31,0.10), 0 2px 6px rgba(18,24,31,0.06);
  --shadow-3:0 20px 48px rgba(18,24,31,0.16);
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:20px;
<!--  --font-display:'Noto Serif KR', 'Nanum Myeongjo', serif; -->
<!--  --font-display:'roboto', 'roboto', serif; -->
  --font-display:'inter', arial, sans-serif; 
  --font-body:'Noto Sans KR', 'Malgun Gothic', sans-serif;
<!--  --font-mono:'IBM Plex Mono', 'Noto Sans KR', monospace; -->
  --font-mono:'inter', 'Noto Sans KR', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e13;
    --surface:#111720;
    --surface-2:#161e28;
    --surface-3:#1c2530;
    --border:#28323d;
    --border-strong:#374350;
    --ink:#eaf0f4;
    --ink-2:#aeb9c3;
    --ink-3:#78838d;
    --brand:#5aa8e6;
    --brand-ink:#8cc4ee;
    --brand-tint:#132a3e;
    --brand-tint-2:#173a56;
    --accent-green:#4bb893;
    --accent-green-tint:#123227;
    --good:#4bb893;
    --warn:#d3a55b;
    --critical:#d97c6f;
    --chart-blue-1:#1c3348;
    --chart-blue-2:#2a4d68;
    --chart-blue-3:#3e739b;
    --chart-blue-4:#5c9bcb;
    --chart-blue-5:#8cc4ee;
    --chart-green-1:#173226;
    --chart-green-2:#1f4a37;
    --chart-green-3:#2f6b54;
    --chart-green-4:#4bb893;
    --shadow-1:0 1px 2px rgba(0,0,0,0.4);
    --shadow-2:0 8px 24px rgba(0,0,0,0.45);
    --shadow-3:0 20px 48px rgba(0,0,0,0.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e13;
  --surface:#111720;
  --surface-2:#161e28;
  --surface-3:#1c2530;
  --border:#28323d;
  --border-strong:#374350;
  --ink:#eaf0f4;
  --ink-2:#aeb9c3;
  --ink-3:#78838d;
  --brand:#5aa8e6;
  --brand-ink:#8cc4ee;
  --brand-tint:#132a3e;
  --brand-tint-2:#173a56;
  --accent-green:#4bb893;
  --accent-green-tint:#123227;
  --good:#4bb893;
  --warn:#d3a55b;
  --critical:#d97c6f;
  --chart-blue-1:#1c3348;
  --chart-blue-2:#2a4d68;
  --chart-blue-3:#3e739b;
  --chart-blue-4:#5c9bcb;
  --chart-blue-5:#8cc4ee;
  --chart-green-1:#173226;
  --chart-green-2:#1f4a37;
  --chart-green-3:#2f6b54;
  --chart-green-4:#4bb893;
  --shadow-1:0 1px 2px rgba(0,0,0,0.4);
  --shadow-2:0 8px 24px rgba(0,0,0,0.45);
  --shadow-3:0 20px 48px rgba(0,0,0,0.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
  height:100vh;
  width:100vw;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--brand);color:#fff;}
a{color:var(--brand);}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}

/* ============ SLIDE ENGINE ============ */
#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
#viewport{
  position:relative;
  width:1280px;height:720px;
  transform-origin:center center;
  background:var(--bg);
  box-shadow:0 0 0 1px var(--border);
}
.slide{
  position:absolute;inset:0;
  width:1280px;height:720px;
  display:none;
  flex-direction:column;
  background:var(--bg);
  opacity:0;
  transform:scale(.97);
  filter:blur(6px);
  transition:opacity .45s cubic-bezier(.22,.61,.36,1), transform .45s cubic-bezier(.22,.61,.36,1), filter .45s ease;
}
.slide.active{display:flex;opacity:1;transform:scale(1);filter:blur(0);}
.slide.leaving{display:flex;opacity:0;transform:scale(1.03);filter:blur(6px);}
@media (prefers-reduced-motion: reduce){
  .slide{transition:opacity .01s linear;transform:none;filter:none;}
}
.slide-inner{
  flex:1;display:flex;flex-direction:column;
  padding:56px 72px 40px;
  min-height:0;
}
.slide-eyebrow{
  font-family:var(--font-mono);
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brand);font-weight:600;
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}
.slide-eyebrow .num{color:var(--ink-3);}
.slide-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:36px;
  line-height:1.25;
  color:var(--ink);
  text-wrap:balance;
  margin:0 0 4px;
}
/* .slide-sub{
  font-size:15px;color:var(--ink-2);margin:0 0 22px;max-width:74ch;line-height:1.6;
} */

.slide-sub{
  font-size:15px;color:var(--ink-2);margin:0 0 12px;max-width:100%;line-height:1.6;
}

.slide-body{flex:1;min-height:0;display:flex;flex-direction:column;}

/* footer / footnote bar */
.footnotes{
  margin-top:auto;padding-top:14px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:6px 18px;
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);
}
.footnotes a{color:var(--ink-2);text-decoration:none;border-bottom:1px dotted var(--border-strong);}
.footnotes a:hover{color:var(--brand);border-color:var(--brand);}
.footnotes .src-tag{color:var(--brand);font-weight:600;}

/* ============ CHROME: hamburger / theme / pager ============ */
#chrome{
  position:absolute;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px 0;
  pointer-events:none;
}
#chrome > *{pointer-events:auto;}
.brandmark{display:flex;align-items:center;gap:9px;}
.brandmark svg{width:22px;height:22px;flex:none;}
.brandmark-logo{height:22px;width:auto;flex:none;display:block;}
.brandmark-text{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);font-weight:600;}
.brandmark-text b{color:var(--ink);}
.chrome-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s, color .15s, border-color .15s, transform .1s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--brand);border-color:var(--border-strong);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:18px;height:18px;}

#progress-track{
  position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--surface-2);z-index:40;
}
#progress-bar{height:100%;background:var(--brand);width:0%;transition:width .4s cubic-bezier(.22,.61,.36,1);}

#pager{
  position:absolute;right:24px;bottom:14px;z-index:40;
  font-family:var(--font-mono);font-size:11px;color:var(--ink-3);
  display:flex;align-items:center;gap:10px;
  background:var(--bg);padding:4px 8px;border-radius:8px;
}
#pager b{color:var(--ink);font-weight:600;}
.nav-arrows{position:absolute;bottom:10px;left:24px;z-index:40;display:flex;gap:6px;}

.clickzone{position:absolute;top:0;bottom:0;width:100px;z-index:30;cursor:pointer;}
.clickzone.left{left:0;}
.clickzone.right{right:0;}

/* ============ TOC DRAWER ============ */
#scrim{position:fixed;inset:0;background:rgba(10,14,19,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:49;}
#scrim.open{opacity:1;pointer-events:auto;}
#drawer{
  position:fixed;top:0;right:0;bottom:0;width:380px;max-width:88vw;
  background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.61,.36,1);
  z-index:50;display:flex;flex-direction:column;box-shadow:var(--shadow-3);
}
#drawer.open{transform:translateX(0);}
.drawer-head{padding:22px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-head h2{font-family:var(--font-display);font-size:19px;margin:0;}
.drawer-list{overflow-y:auto;padding:8px 12px 24px;flex:1;}
.drawer-section{margin:14px 10px 4px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}
.drawer-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:9px 10px;border-radius:9px;border:none;background:transparent;cursor:pointer;
  color:var(--ink-2);font-size:13.5px;font-family:var(--font-body);
}
.drawer-item:hover{background:var(--surface-2);color:var(--ink);}
.drawer-item.current{background:var(--brand-tint);color:var(--brand-ink);font-weight:600;}
.drawer-item .idx{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);width:22px;flex:none;}
.drawer-item.current .idx{color:var(--brand);}

/* ============ TYPOGRAPHY HELPERS ============ */
.eyebrow-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--brand-tint);color:var(--brand-ink);border-radius:100px;padding:4px 10px 4px 8px;font-weight:600;
}
.kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;}
h1,h2,h3{font-family:var(--font-display);}
.num-mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ============ TOOLTIP ============ */
<!-- .tip{position:relative;text-decoration:underline dashed var(--ink-3);text-underline-offset:3px;cursor:help;} -->
.tip{position:relative;text-decoration:underline var(--ink-3);text-underline-offset:3px;cursor:help;}
.tip::after{
  content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%) translateY(4px);
  width:max-content;max-width:260px;background:var(--ink);color:var(--bg);font-family:var(--font-body);
  font-size:12px;line-height:1.5;padding:9px 12px;border-radius:9px;box-shadow:var(--shadow-2);
  opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;z-index:60;font-weight:400;
}
:root[data-theme="dark"] .tip::after{background:var(--surface-3);color:var(--ink);border:1px solid var(--border-strong);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip::after{background:var(--surface-3);color:var(--ink);border:1px solid var(--border-strong);}}
.tip::before{
  content:"";position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink);opacity:0;transition:opacity .15s;
}
:root[data-theme="dark"] .tip::before{border-top-color:var(--surface-3);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip::before{border-top-color:var(--surface-3);}}
.tip:hover::after,.tip:focus::after,.tip:hover::before,.tip:focus::before{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ CARDS ============ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  box-shadow:var(--shadow-1);
}
.grid{display:grid;gap:16px;}

/* KPI tiles */
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:18px 20px;display:flex;flex-direction:column;gap:6px;justify-content:center;
}
.kpi .kpi-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.kpi .kpi-value{font-family:var(--font-mono);font-size:30px;font-weight:700;color:var(--brand);line-height:1.1;}
.kpi .kpi-value small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:3px;}
.kpi .kpi-note{font-size:11.5px;color:var(--ink-3);}

/* project cards (grid of small projects) */
.proj-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;
}
.proj-card .p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.proj-card .p-client{font-weight:700;font-size:13.5px;color:var(--ink);}
.proj-card .p-date{font-family:var(--font-mono);font-size:10.5px;color:var(--brand);white-space:nowrap;}
.proj-card .p-cargo{font-size:12.5px;color:var(--ink-2);line-height:1.6;}
.proj-card .p-route{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;}
.proj-card .p-weight{margin-top:auto;font-family:var(--font-mono);font-size:11px;color:var(--accent-green);font-weight:600;}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:100px;}
.badge.blue{background:var(--brand-tint);color:var(--brand-ink);}
.badge.green{background:var(--accent-green-tint);color:var(--accent-green);}

/* ============ COVER / DIVIDER ============ */
.slide.cover .slide-inner, .slide.divider .slide-inner{padding:0;position:relative;overflow:hidden;}
.cover-bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--brand-ink) 0%,var(--brand) 62%,#0d3a63 100%);}
:root[data-theme="dark"] .cover-bg,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover-bg{background:linear-gradient(160deg,#04182a 0%, #0c3358 55%, #123b63 100%);}}
:root[data-theme="dark"] .cover-bg{background:linear-gradient(160deg,#04182a 0%, #0c3358 55%, #123b63 100%);}
.cover-lines{position:absolute;inset:0;opacity:.5;}
.cover-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:64px 76px;color:#fff;}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;}
.cover-mark{display:flex;align-items:center;gap:14px;}
.cover-mark svg{width:38px;height:38px;}
.cover-mark-chip{display:flex;align-items:center;background:#fff;border-radius:8px;padding:7px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.cover-mark-chip img{height:22px;width:auto;display:block;}
.cover-mark span{font-family:var(--font-mono);font-size:13px;letter-spacing:.1em;font-weight:700;color:#fff;}
.cover-tag{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.35);border-radius:100px;padding:5px 12px;}
.cover-mid{max-width:900px;}
.cover-kicker{font-family:var(--font-mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#bfe0ff;margin-bottom:18px;}
.cover-title{font-family:var(--font-display);font-weight:700;font-size:60px;line-height:1.18;color:#fff;margin:0 0 18px;text-wrap:balance;}
.cover-title em{font-style:normal;color:#bfe0ff;}
.cover-desc{font-size:16px;color:rgba(255,255,255,.82);max-width:64ch;line-height:1.7;}
.cover-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
.cover-meta{display:flex;gap:34px;}
.cover-meta div{display:flex;flex-direction:column;gap:3px;}
.cover-meta .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);}
.cover-meta .val{font-family:var(--font-mono);font-size:14px;color:#fff;font-weight:600;}
.cover-scroll{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px;}

.divider .slide-inner{background:linear-gradient(160deg,var(--brand-ink) 0%, var(--brand) 100%);color:#fff;justify-content:center;padding:64px 90px;}
:root[data-theme="dark"] .divider .slide-inner{background:linear-gradient(160deg,#04182a 0%, #0c3358 100%);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .divider .slide-inner{background:linear-gradient(160deg,#04182a 0%, #0c3358 100%);}}
.divider .d-index{font-family:var(--font-mono);font-size:100px;font-weight:700;color:rgba(255,255,255,.18);line-height:1;margin-bottom:10px;}
.divider .d-kicker{font-family:var(--font-mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#bfe0ff;margin-bottom:14px;}
.divider .d-title{font-family:var(--font-display);font-size:46px;font-weight:700;color:#fff;line-height:1.25;max-width:820px;text-wrap:balance;}
.divider .d-desc{font-size:15px;color:rgba(255,255,255,.82);max-width:62ch;margin-top:18px;line-height:1.7;}
.divider .d-list{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;}
.divider .d-list span{font-family:var(--font-mono);font-size:11.5px;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:100px;padding:6px 14px;}

/* ============ CHART PRIMITIVES ============ */
.chart-wrap{width:100%;}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:11.5px;color:var(--ink-2);}
.chart-legend .li{display:flex;align-items:center;gap:6px;}
.chart-legend .sw{width:10px;height:10px;border-radius:3px;}
.bars-h .row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bars-h .row .lbl{width:150px;flex:none;font-size:11.5px;color:var(--ink-2);text-align:right;}
.bars-h .row .track{flex:1;height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative;}
.bars-h .row .fill{height:100%;border-radius:5px;display:flex;align-items:center;}
.bars-h .row .val{width:74px;flex:none;font-family:var(--font-mono);font-size:11px;color:var(--ink);font-weight:600;}

/* project profile slide layout */
.profile{display:grid;grid-template-columns:1.28fr 1fr;gap:28px;flex:1;min-height:0;}
.profile-left{display:flex;flex-direction:column;gap:14px;min-height:0;}
.profile-lede{font-size:13.5px;line-height:1.6;color:var(--ink-2);}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.spec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;}
.spec .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;}
.spec .v{font-size:13px;font-weight:600;color:var(--ink);}
.route-line{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px 14px;}
.route-line .pt{flex:1;}
.route-line .pt .k{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;}
.route-line .pt .v{font-size:13px;font-weight:700;color:var(--ink);}
.route-line .arrow{color:var(--brand);flex:none;}
.profile-right{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.profile-right h4{margin:0;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.hero-num{display:flex;align-items:baseline;gap:6px;}
.hero-num .n{font-family:var(--font-mono);font-size:44px;font-weight:700;color:var(--brand);}
.hero-num .u{font-size:14px;color:var(--ink-2);font-weight:600;}
.fact-list{display:flex;flex-direction:column;gap:9px;}
.fact-list li{list-style:none;display:flex;gap:9px;font-size:12.5px;color:var(--ink-2);line-height:1.6;}
.fact-list li .dot{width:5px;height:5px;border-radius:50%;background:var(--accent-green);flex:none;margin-top:7px;}

/* real project photo card */
.proj-photo{position:relative;border-radius:var(--radius-s);overflow:hidden;border:1px solid var(--border);height:132px;flex:none;}
.proj-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.proj-photo .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:8px 12px;background:linear-gradient(to top, rgba(10,20,30,.72), rgba(10,20,30,0));color:#fff;}
.proj-photo .cap span{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;}
.proj-photo .cap .credit{opacity:.75;font-size:9px;letter-spacing:.05em;text-transform:none;}
.photo-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.photo-strip .proj-photo{height:150px;}

/* real shipment route map (reuses megaline-project-map-advanced coastline & projection) */
.map-card{padding:14px;display:flex;flex-direction:column;gap:8px;}
.route-map{width:100%;height:auto;display:block;border-radius:6px;}
.route-map .rm-sea{fill:var(--surface-2);}
.route-map .rm-land{fill:var(--border);stroke:var(--border-strong);stroke-width:.6;}
.route-map .rm-route{fill:none;stroke:var(--chart-blue-4);stroke-width:1.4;opacity:.72;transition:opacity .15s, stroke-width .15s;}
.route-map .rm-route:hover{opacity:1;stroke-width:2.6;stroke:var(--brand);cursor:pointer;}
.route-map .rm-pt{stroke:var(--surface);stroke-width:1.2;}
.route-map .rm-pt-origin{fill:var(--chart-blue-5);}
.route-map .rm-pt-dest{fill:var(--accent-green);}
.map-legend-inline{display:flex;gap:18px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;}
.map-legend-inline span{display:flex;align-items:center;gap:6px;}
.map-legend-inline i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.map-legend-inline i.blue{background:var(--chart-blue-5);}
.map-legend-inline i.green{background:var(--accent-green);}
.route-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;}
.route-list li{list-style:none;font-size:11px;color:var(--ink-2);line-height:1.5;display:flex;gap:7px;}
.route-list li b{color:var(--ink);font-weight:600;}
.route-list li .dot{width:5px;height:5px;border-radius:50%;background:var(--chart-blue-4);flex:none;margin-top:6px;}

/* video cards */
.video-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s, box-shadow .15s;}
.video-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-2);}
.video-thumb{aspect-ratio:16/9;border-radius:9px;background:linear-gradient(140deg,var(--brand-tint),var(--surface-2));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.video-thumb svg{width:34px;height:34px;color:var(--brand);}
.video-title{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4;}
.video-desc{font-size:11px;color:var(--ink-3);}

/* diagram steps */
.steps{display:flex;gap:12px;}
.step{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;}
.step .s-idx{font-family:var(--font-mono);font-size:11px;color:var(--brand);font-weight:700;}
.step .s-title{font-weight:700;font-size:13px;}
.step .s-desc{font-size:11.5px;color:var(--ink-2);line-height:1.6;}
.step-arrow{align-self:center;color:var(--ink-3);flex:none;display:flex;align-items:center;}

/* section dividing small headers on content slides */
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.mini-head h3{margin:0;font-size:14px;color:var(--ink);}
</style>

window.__SLIDES_HTML__ = S;

/* ============================================================
   ENGINE
   ============================================================ */
(function(){
  const viewport = document.getElementById('viewport');
  const stage = document.getElementById('stage');
  let current = 0;
  const total = S.length;

  // ---- build slide DOM nodes ----
  const slideEls = S.map((html, i)=>{
    const el = document.createElement('div');
    el.className = 'slide' + (S[i].includes('class="slide-inner cover"') ? ' cover' : '') + (S[i].includes('class="slide-inner divider"') ? ' divider' : '');
    el.innerHTML = html;
    el.dataset.index = i;
    viewport.appendChild(el);
    return el;
  });
  slideEls[0].classList.add('active');

  document.getElementById('pagerTotal').textContent = String(total).padStart(2,'0');

  function pad(n){ return String(n+1).padStart(2,'0'); }

  function go(idx, dir){
    if(idx < 0 || idx >= total || idx === current) return;
    const prevEl = slideEls[current];
    const nextEl = slideEls[idx];
    prevEl.classList.remove('active');
    prevEl.classList.add('leaving');
    nextEl.style.transform = dir === 'back' ? 'translateX(-24px)' : 'translateX(24px)';
    nextEl.classList.add('active');
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ nextEl.style.transform=''; });
    });
    setTimeout(()=>{ prevEl.classList.remove('leaving'); }, 520);
    current = idx;
    document.getElementById('pagerCur').textContent = pad(current);
    document.getElementById('progress-bar').style.width = ((current+1)/total*100) + '%';
    updateDrawerActive();
  }

  document.getElementById('nextBtn').addEventListener('click', ()=>go(current+1,'fwd'));
  document.getElementById('prevBtn').addEventListener('click', ()=>go(current-1,'back'));
  document.getElementById('zoneRight').addEventListener('click', ()=>go(current+1,'fwd'));
  document.getElementById('zoneLeft').addEventListener('click', ()=>go(current-1,'back'));

  window.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); go(current+1,'fwd'); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(current-1,'back'); }
    else if(e.key === 'Escape'){ closeDrawer(); }
    else if(e.key === 'Home'){ go(0,'back'); }
    else if(e.key === 'End'){ go(total-1,'fwd'); }
  });

  // touch swipe
  let touchX = null;
  stage.addEventListener('touchstart', (e)=>{ touchX = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', (e)=>{
    if(touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50){ dx < 0 ? go(current+1,'fwd') : go(current-1,'back'); }
    touchX = null;
  }, {passive:true});

  // ---- scaling engine (16:9 @1280x720 base) ----
  function scaleStage(){
    const pad = 24;
    const availW = window.innerWidth - pad*2;
    const availH = window.innerHeight - pad*2;
    const scale = Math.min(availW/1280, availH/720);
    viewport.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', scaleStage);
  scaleStage();

  // ---- theme toggle ----
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(t){
    if(t === 'dark'){ root.setAttribute('data-theme','dark'); }
    else if(t === 'light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  let storedTheme = null;
  try{ storedTheme = localStorage.getItem('megaline-htv-theme'); }catch(e){}
  if(storedTheme){ applyTheme(storedTheme); }
  themeBtn.addEventListener('click', ()=>{
    const isDark = getComputedStyle(root).getPropertyValue('--bg').trim().toLowerCase() !== '#ffffff';
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('megaline-htv-theme', next); }catch(e){}
  });

  // ---- fullscreen toggle ----
  const fsBtn = document.getElementById('fullscreenToggle');
  const fsIcon = document.getElementById('fullscreenIcon');
  const ICON_EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>';
  const ICON_COMPRESS = '<path d="M9 3v3a2 2 0 0 1-2 2H4M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>';
  function syncFsIcon(){
    const on = !!document.fullscreenElement;
    fsIcon.innerHTML = on ? ICON_COMPRESS : ICON_EXPAND;
    fsBtn.setAttribute('title', on ? '전체 화면 종료' : '전체 화면 전환');
    fsBtn.setAttribute('aria-label', on ? '전체 화면 종료' : '전체 화면 전환');
  }
  fsBtn.addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if(req){ req.call(el); }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if(exit){ exit.call(document); }
    }
  });
  ['fullscreenchange','webkitfullscreenchange','msfullscreenchange'].forEach(ev=>{
    document.addEventListener(ev, syncFsIcon);
  });

  // ---- TOC drawer ----
  const TOC = [
    {section:'Cover', items:[[0,'표지']]},
    {section:'Overview', items:[[1,'목차']]},
    {section:'Part 01 · 개요 & 실적', items:[
      [2,'회사 소개'],[3,'보유 선대 & 네트워크'],[4,'운송 영역'],[5,'누적 실적 KPI'],
      [6,'연도별 수행 추이'],[7,'화물 유형별 분류'],[8,'화주 유형별 분류'],[9,'글로벌 운송 네트워크']
    ]},
    {section:'Part 02 · Energy Major', items:[
      [10,'Part 02 개요'],[11,'Chevron · Wheatstone'],[12,'Chevron · Gorgon'],[13,'Chevron · Anchor FPU'],
      [14,'Chevron · Jansz-Io FCS'],[15,'Petrobras · TUPI/Lula'],[16,'Petrobras · FPSO P-79'],
      [17,'Equinor · Gina Krog'],[18,'Qatar Petroleum · Al Shaheen'],[19,'Linde Gas · Singapore'],[20,'Lamprell · 해상풍력 외']
    ]},
    {section:'Part 03 · 조선 & 산업설비', items:[
      [21,'Part 03 개요'],[22,'조선 3사 장기 파트너십'],[23,'기타 산업설비 · 크레인']
    ]},
    {section:'Part 04 · 엔지니어링', items:[
      [24,'Part 04 개요'],[25,'적하 · 양하 공법'],[26,'시파스닝 & 그릴리지'],[27,'안정성 · 모션 · 계류'],
      [28,'참고 영상자료'],[29,'맺음말 · Contact']
    ]}
  ];
  const drawerList = document.getElementById('drawerList');
  const drawerBtns = [];
  TOC.forEach(sec=>{
    const h = document.createElement('div');
    h.className = 'drawer-section';
    h.textContent = sec.section;
    drawerList.appendChild(h);
    sec.items.forEach(([idx,label])=>{
      const b = document.createElement('button');
      b.className = 'drawer-item';
      b.innerHTML = '<span class="idx">'+pad(idx)+'</span><span>'+label+'</span>';
      b.addEventListener('click', ()=>{ go(idx, idx>current?'fwd':'back'); closeDrawer(); });
      drawerList.appendChild(b);
      drawerBtns.push({idx,el:b});
    });
  });
  function updateDrawerActive(){
    drawerBtns.forEach(({idx,el})=>{ el.classList.toggle('current', idx===current); });
  }
  updateDrawerActive();

  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }
  document.getElementById('menuToggle').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);

  // init progress
  document.getElementById('progress-bar').style.width = (100/total) + '%';
})();
</script>
